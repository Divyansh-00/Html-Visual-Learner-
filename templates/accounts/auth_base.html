{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block auth_title %}Auth{% endblock %} — HTML Visual Learning Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg,#6366f1,#8b5cf6); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: white; margin: 0 auto 12px; box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .auth-logo-title { font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; }
    .auth-logo-sub { font-size: 13px; color: var(--text-muted); font-weight: 400; }
    .auth-title { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.02em; }
    .auth-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    .form-control { padding: 11px 14px; }
    .errorlist { list-style: none; padding: 0; margin: 4px 0 0; }
    .errorlist li { font-size: 12px; color: var(--color-error); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary); }
    .auth-footer a { color: var(--accent-primary); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  {% block auth_content %}{% endblock %}
</body>
</html>
